name: Java MapReduce CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download Hadoop Client & Compile MapReduceApp
        run: |
          mkdir -p lib build
          curl -sL https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-common/3.3.6/hadoop-common-3.3.6.jar -o lib/hadoop-common.jar
          curl -sL https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-mapreduce-client-core/3.3.6/hadoop-mapreduce-client-core-3.3.6.jar -o lib/hadoop-mr-core.jar
          javac -cp "lib/*" src/MapReduceApp.java -d build/
          jar cf build/mapreduce.jar -C build/ .